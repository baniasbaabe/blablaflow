name: ci
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p blablaflow-core --all-targets -- -D warnings
      - run: cargo test -p blablaflow-core
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build

  app:
    runs-on: windows-latest
    env:
      BLABLAFLOW_TEST_MODEL: ${{ github.workspace }}/ggml-tiny.bin
      BLABLAFLOW_TEST_WAV: ${{ github.workspace }}/jfk.wav
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: humbletim/install-vulkan-sdk@v1.2
        with: { version: latest, cache: true }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Test fixtures
        shell: bash
        run: |
          curl -sSLo ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          curl -sSLo jfk.wav https://github.com/ggml-org/whisper.cpp/raw/master/samples/jfk.wav
      - run: cargo clippy -p blablaflow --features vulkan --all-targets -- -D warnings
      - run: cargo test -p blablaflow --features vulkan -- --include-ignored
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: npx tauri build --features vulkan
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: blablaflow-setup
          path: target/release/bundle/nsis/*.exe
