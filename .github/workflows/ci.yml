name: ci
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p blablaflow-core --all-targets -- -D warnings
      - run: cargo test -p blablaflow-core
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build

  app:
    runs-on: windows-latest
    env:
      # whisper.cpp's Vulkan shader build exceeds Windows' 260-character path limit under the default target dir.
      CARGO_TARGET_DIR: C:\t
      BLABLAFLOW_TEST_MODEL: ${{ github.workspace }}/ggml-tiny.bin
      BLABLAFLOW_TEST_WAV: ${{ github.workspace }}/jfk.wav
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '. -> C:\t' }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Test fixtures
        shell: bash
        run: |
          curl -sSLo ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          curl -sSLo jfk.wav https://github.com/ggml-org/whisper.cpp/raw/master/samples/jfk.wav
      - run: cargo clippy -p blablaflow --all-targets -- -D warnings
      - run: cargo test -p blablaflow -- --include-ignored
      # The GPU (Vulkan) build is slow; only main gets it, together with the installer.
      - if: github.ref == 'refs/heads/main'
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with: { vulkan_version: latest, install_runtime: true, cache: true, stripdown: true }
      - if: github.ref == 'refs/heads/main'
        run: cargo clippy -p blablaflow --features vulkan -- -D warnings
      - if: github.ref == 'refs/heads/main'
        run: npx tauri build --features vulkan
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: blablaflow-setup
          path: C:\t\release\bundle\nsis\*.exe
