[package]
name = "blablaflow"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
blablaflow-core = { path = "../crates/core" }
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
whisper-rs = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
arboard = "3"
log = "0.4"
anyhow = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[features]
vulkan = ["whisper-rs/vulkan"]
