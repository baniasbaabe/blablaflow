[package]
name = "blablaflow"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
blablaflow-core = { path = "../crates/core" }
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
vulkan = []
